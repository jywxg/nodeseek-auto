name: nodeseek鸡腿签到

on:
  push:
    branches:
      - main
  schedule:
    - cron: '35 23 * * *'  # UTC 23:35 = 北京时间次日 07:35
  workflow_dispatch:

permissions:
  contents: write  # 运行记录提交需要写权限（保活）
  actions: write  # 添加写入Actions变量的权限

jobs:
  run-nodeseek-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          pip install curl_cffi requests

      - name: 运行签到脚本
        env:
          # 基本账号
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}

          # 额外账号1-5
          USER1: ${{ secrets.USER1 }}
          PASS1: ${{ secrets.PASS1 }}
          USER2: ${{ secrets.USER2 }}
          PASS2: ${{ secrets.PASS2 }}
          USER3: ${{ secrets.USER3 }}
          PASS3: ${{ secrets.PASS3 }}
          USER4: ${{ secrets.USER4 }}
          PASS4: ${{ secrets.PASS4 }}
          USER5: ${{ secrets.USER5 }}
          PASS5: ${{ secrets.PASS5 }}

          # Cookie配置
          NS_COOKIE: ${{ vars.NS_COOKIE || secrets.NS_COOKIE }}

          # 验证码配置
          SOLVER_TYPE: ${{ secrets.SOLVER_TYPE }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CLIENTT_KEY: ${{ secrets.CLIENTT_KEY }}

          # GitHub API配置
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # 通知推送配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: python nodeseek_sign.py

      - name: 更新运行记录（保活 Actions）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最后运行时间: $(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 自动更新运行记录，保活 Actions"
            git stash -u || true
            git pull origin main --rebase --autostash || git pull origin main
            git stash pop || true
            git push origin HEAD:main
          fi

      - name: 清理历史运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "🧹 清理历史运行记录（只保留本次 run: $GITHUB_RUN_ID）"
          # gh --paginate 自动翻页，全仓库所有 run 全部拉出
          runs=$(gh api "repos/$REPO/actions/runs?per_page=100" --paginate -q '.workflow_runs[].id' 2>/dev/null || true)
          deleted=0
          for run in $runs; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "  删除历史记录 ID: $run"
              gh api -X DELETE "repos/$REPO/actions/runs/$run" --silent || true
              deleted=$((deleted + 1))
            fi
          done
          echo "✅ 已清理 $deleted 条历史运行记录"
